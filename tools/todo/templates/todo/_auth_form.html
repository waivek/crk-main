{% extends "todo/base.html" %}
{% block body %}
<main class="auth">
  <h1>{{ heading }}</h1>
  {% if errors %}
  <ul class="errors" role="alert">
    {% for e in errors %}<li><span class="material-symbols-outlined" aria-hidden="true">error</span>{{ e }}</li>{% endfor %}
  </ul>
  {% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username
      <input name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="{{ pw_autocomplete }}" required>
    </label>
    {% block extra_fields %}{% endblock %}
    <button class="primary">{{ heading }}</button>
  </form>
  <p class="muted">{% block switch %}{% endblock %}</p>
</main>
{% endblock %}
